[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indic-phonetic"
version = "0.0.1"
description = "Match Indian names and places by how they sound, across Devanagari, Tamil and Roman script"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aman Trivedi", email = "amantrivedi2003@gmail.com" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["phonetic", "fuzzy matching", "indic", "transliteration", "hindi", "tamil", "names", "speech"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
    "Natural Language :: Hindi",
    "Natural Language :: Tamil",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
bench = ["rapidfuzz>=3", "jellyfish>=1"]
demo = ["gradio>=6"]

[tool.hatch.build.targets.wheel]
packages = ["src/indic_phonetic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
