[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "misheard"
dynamic = ["version"]
description = "Match Indian names and places by how they sound, across Devanagari, Tamil and Roman script"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aman Trivedi", email = "amantrivedi2003@gmail.com" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["phonetic", "fuzzy matching", "indic", "transliteration", "hindi", "tamil", "names", "speech"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: Marathi",
    "Topic :: Text Processing :: Linguistic",
    "Natural Language :: Hindi",
    "Natural Language :: Tamil",
    "Typing :: Typed",
]

[project.scripts]
misheard = "misheard.cli:main"

[project.urls]
Homepage = "https://github.com/trivedi-aman/misheard"
Changelog = "https://github.com/trivedi-aman/misheard/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/trivedi-aman/misheard/blob/main/PLAN.md"
Issues = "https://github.com/trivedi-aman/misheard/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]
bench = ["rapidfuzz>=3", "jellyfish>=1"]
demo = ["gradio>=6"]

[tool.hatch.version]
path = "src/misheard/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = [".github", "demo", "legacy"]

[tool.hatch.build.targets.wheel]
packages = ["src/misheard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
