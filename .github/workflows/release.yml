# Publish to PyPI when a version tag (v0.1.0) is pushed.
# Uses PyPI trusted publishing: no API token is stored in GitHub.
# One-time setup on pypi.org: add a pending publisher for project
# "misheard", this repository, workflow "release.yml", environment "pypi".
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build twine pytest
      - run: python -m build
      - run: twine check dist/*
      - name: Test the built wheel, not the source tree
        run: |
          pip install dist/*.whl
          cd tests && python -m pytest -q -p no:cacheprovider .
      - name: Tag matches package version
        run: |
          v=$(python -c "import misheard; print(misheard.__version__)")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version $v"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
